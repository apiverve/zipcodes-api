openapi: 3.0.4
info:
  title: Zip Codes Lookup
  description: >-
    Zip Codes Lookup finds all postal codes within a US city or resolves a
    five-digit ZIP code to its city and state. Paid plans add the IANA time
    zone, geographic coordinates and the distance from the ZIP to a second ZIP.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/zipcodes:
    get:
      summary: Zip Codes Lookup
      description: >-
        Lookup the city, state and (paid plans) time zone of a zip code,
        optionally with the distance to a second zip code
      operationId: zipcodes
      parameters:
        - name: zip
          in: query
          schema:
            type: string
          required: true
          description: The zip code for which you want to get the data
          example: '64082'
        - name: distanceTo
          in: query
          schema:
            type: string
          required: false
          description: >-
            A second US ZIP code; adds a distance object with the straight-line
            distance between the two ZIP centroids
          example: '64106'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  zipcode: '64082'
                  state_abbr: MO
                  latitude: '38.850243'
                  longitude: '-94.39570'
                  city: Lees Summit
                  state: Missouri
                  timezone: America/Chicago
                  distance:
                    zipcode: '64106'
                    city: Kansas City
                    state_abbr: MO
                    miles: 19.94
                    kilometers: 32.09
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
